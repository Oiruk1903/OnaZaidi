services:
  postgres:
    image: postgres:16-alpine
    container_name: onazaidi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - onazaidi_pgdata:/var/lib/postgresql/data
    networks: [onazaidi]
    # Do NOT expose Postgres to the host in production
    expose:
      - "5432"

  minio:
    image: quay.io/minio/minio:latest
    container_name: onazaidi-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - onazaidi_miniodata:/data
    networks: [onazaidi]
    expose:
      - "9000"
      - "9001"

  backend:
    build:
      context: ./backend
    container_name: onazaidi-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - minio
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      STORAGE_PROVIDER: s3
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_ENDPOINT: http://minio:9000
      S3_PATH_STYLE_ACCESS: "true"
      ONAZAIDI_BOOTSTRAP_ADMIN_EMAIL: ${ADMIN_EMAIL}
      ONAZAIDI_BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PESAPAL_KEY: ${PESAPAL_KEY:-}
      PESAPAL_SECRET: ${PESAPAL_SECRET:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      CORS_ORIGINS: https://${DOMAIN},https://www.${DOMAIN}
    volumes:
      - onazaidi_storage:/app/storage
    networks: [onazaidi]
    expose:
      - "8080"

  frontend:
    build:
      context: ./onazaidi-frontend
      args:
        VITE_API_URL: /api/v1
    container_name: onazaidi-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - onazaidi_caddy_data:/data
      - onazaidi_caddy_config:/config
    networks: [onazaidi]

volumes:
  onazaidi_pgdata:
  onazaidi_miniodata:
  onazaidi_storage:
  onazaidi_caddy_data:
  onazaidi_caddy_config:

networks:
  onazaidi:
    driver: bridge
