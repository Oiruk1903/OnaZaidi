spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: false

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-ms: 900000
  refresh-token-expiry-ms: 604800000
  issuer: onazaidi

storage:
  provider: ${STORAGE_PROVIDER:s3}
  bucket: ${S3_BUCKET}
  region: ${S3_REGION}
  access-key: ${S3_ACCESS_KEY}
  secret-key: ${S3_SECRET_KEY}
  endpoint: ${S3_ENDPOINT}
  path-style-access: ${S3_PATH_STYLE_ACCESS:true}
  signed-url-expiry-seconds: 300
  public-base-url: ${PUBLIC_MEDIA_BASE_URL:}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

payment:
  callback-base-url: https://${DOMAIN:localhost:5173}
  pesapal:
    enabled: ${PESAPAL_ENABLED:false}
    consumer-key: ${PESAPAL_KEY:}
    consumer-secret: ${PESAPAL_SECRET:}
  paypal:
    enabled: ${PAYPAL_ENABLED:false}
    client-id: ${PAYPAL_CLIENT_ID:}
    client-secret: ${PAYPAL_CLIENT_SECRET:}

onazaidi:
  bootstrap-admin:
    email: ${ONAZAIDI_BOOTSTRAP_ADMIN_EMAIL:admin@onazaidi.com}
    password: ${ONAZAIDI_BOOTSTRAP_ADMIN_PASSWORD:Admin12345!}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.onazaidi: INFO
    org.hibernate.SQL: WARN
