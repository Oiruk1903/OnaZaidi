spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/onazaidi
    username: onazaidi
    password: onazaidi
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 500MB

  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

server:
  port: 8081

jwt:
  secret: "change-me-super-long-secret-key-for-onazaidi-min-64-chars-please-1234567890"
  access-token-expiry-ms: 900000        # 15 min
  refresh-token-expiry-ms: 604800000    # 7 days
  issuer: onazaidi

storage:
  provider: local                    # or "s3" for MinIO / AWS / R2
  public-base-url: ""                # only for s3: e.g. https://cdn.onazaidi.com
  signed-url-expiry-seconds: 300

  # Only used when provider = s3
  bucket: onazaidi-media
  region: us-east-1
  access-key: minio
  secret-key: minio12345
  endpoint: http://localhost:9000
  path-style-access: true

  # Only used when provider = local
  local:
    base-path: ./storage
    public-base-url: http://localhost:8081/files

payment:
  callback-base-url: http://localhost:5173
  pesapal:
    enabled: false            # flip to true once you have sandbox keys
    base-url: https://cybqa.pesapal.com/pesapalv3
    consumer-key: ${PESAPAL_KEY:}
    consumer-secret: ${PESAPAL_SECRET:}
    callback-url: http://localhost:5173/payment/callback
    ipn-url: http://localhost:8080/api/v1/webhooks/payments/pesapal
    ipn-id: ""               # leave blank to auto-register on first use
  paypal:
    enabled: false           # leave off until you've verified your PayPal merchant eligibility
    mode: sandbox
    base-url: https://api-m.sandbox.paypal.com
    client-id: ${PAYPAL_CLIENT_ID:}
    client-secret: ${PAYPAL_CLIENT_SECRET:}
    return-url: http://localhost:5173/payment/callback
    cancel-url: http://localhost:5173/payment/failed
    webhook-id: ""

email:
  from: no-reply@onazaidi.com
  admin: admin@onazaidi.com

cors:
  allowed-origins: http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.springframework.web: DEBUG
    com.onazaidi: DEBUG
onazaidi:
  bootstrap-admin:
    email: admin@onazaidi.com
    password: Admin#12345!